product: jvm/app

dependencies:
    - org.slf4j:slf4j-simple:2.0.17
    - org.jetbrains.kotlinx:kotlinx-coroutines-swing:1.11.0
    - $kotlin.serialization.json
    - $compose.foundation
    - $compose.components.resources
    - $compose.desktop.currentOs
    - $compose.desktop.components.splitPane
    - org.jetbrains.compose.material3:material3:1.12.0-alpha03
    - org.jetbrains.compose.material:material-icons-extended:1.7.3
    - org.jetbrains.androidx.navigation3:navigation3-ui:1.2.0-alpha02
    - org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0
    - org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3:2.11.0
    - io.coil-kt.coil3:coil-compose:3.5.0
    - io.coil-kt.coil3:coil-network-ktor3:3.5.0
    - io.github.vinceglb:filekit-dialogs-compose:0.14.2
    - bom: io.arrow-kt:arrow-stack:2.3.0-alpha.4
    - io.arrow-kt:arrow-core
    - io.arrow-kt:arrow-fx-coroutines
    - io.arrow-kt:arrow-resilience
    - io.arrow-kt:arrow-optics
    - io.arrow-kt:suspendapp
    - io.github.nomisrev:kotlinx-serialization-jsonpath:1.0.0
    - io.github.reactivecircus.cache4k:cache4k:0.14.0
    - $ktor.client
    - $ktor.client.cio
    - $ktor.client.contentNegotiation
    - $ktor.serialization.kotlinx.json

settings:
    kotlin:
        version: 2.4.10
        serialization:
            format: json
            version: 1.11.0
        freeCompilerArgs:
            - "-Xreturn-value-checker=check"
            - "-Xexplicit-backing-fields"
        # ksp:
        #    processors:
        #        - io.arrow-kt:arrow-optics-ksp-plugin
        compilerPlugins:
            - id: arrow.optics.plugin
              dependency: io.arrow-kt:arrow-optics-compiler-plugin:2.3.0-alpha.4
    compose:
        enabled: true
        version: 1.12.0-beta02
        resources:
            packageName: resources
    ktor:
        enabled: true
        version: 3.5.1