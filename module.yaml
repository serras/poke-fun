product: jvm/app

dependencies:
    - org.slf4j:slf4j-simple:2.0.17
    - org.jetbrains.kotlinx:kotlinx-coroutines-swing:1.11.0
    - $kotlin.serialization.json
    - $compose.foundation
    - $compose.components.resources
    - $compose.desktop.currentOs
    - $compose.desktop.components.splitPane
    - org.jetbrains.compose.material3:material3:1.12.0-alpha03
    - org.jetbrains.compose.material:material-icons-extended:1.7.3
    - org.jetbrains.androidx.navigation3:navigation3-ui:1.2.0-rc01
    - org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0
    - org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3:2.11.0
    - io.coil-kt.coil3:coil-compose:3.6.2
    - io.coil-kt.coil3:coil-network-ktor3:3.6.3
    - io.github.vinceglb:filekit-dialogs-compose:0.16.0
    - bom: io.arrow-kt:arrow-stack:2.3.0.1
    - io.arrow-kt:arrow-core
    - io.arrow-kt:arrow-fx-coroutines
    - io.arrow-kt:arrow-resilience
    - io.arrow-kt:arrow-optics
    - io.arrow-kt:suspendapp
    - io.github.nomisrev:kotlinx-serialization-jsonpath:1.0.0
    - io.github.reactivecircus.cache4k:cache4k:0.14.0
    - $ktor.client
    - $ktor.client.cio
    - $ktor.client.contentNegotiation
    - $ktor.serialization.kotlinx.json
    - ai.koog:koog-agents:1.3.0
    - ai.koog:prompt-executor-ollama-client:1.3.0

test-dependencies:
    - $kotlin.test
    - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0
    - io.kotest:kotest-assertions-core:6.2.6
    - io.kotest:kotest-property:6.2.6

settings:
    jvm:
        jdk:
            version: 25
            distributions: [ jetbrains ]
    kotlin:
        version: 2.4.21
        serialization:
            enabled: true
            version: 1.12.0
        freeCompilerArgs:
            - "-Xreturn-value-checker=check"
        # ksp:
        #    processors:
        #        - io.arrow-kt:arrow-optics-ksp-plugin
        compilerPlugins:
            - id: arrow.optics.plugin
              dependency: io.arrow-kt:arrow-optics-compiler-plugin:2.3.0.1
    compose:
        enabled: true
        version: 1.12.2
        resources:
            packageName: resources
    ktor:
        enabled: true
        version: 3.6.0
